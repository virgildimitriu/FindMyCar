<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Search Romanian and German car portals against your criteria and keep the matches in one place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Find My Car">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Find My Car</title>
<style>
:root{
  --bg:oklch(0.98 0.006 90);
  --surface:#fff;
  --text:oklch(0.2 0.01 90);
  --text-2:oklch(0.45 0.01 90);
  --text-3:oklch(0.55 0.01 90);
  --text-4:oklch(0.62 0.01 90);
  --line:oklch(0.9 0.006 90);
  --line-2:oklch(0.94 0.006 90);
  --line-3:oklch(0.88 0.006 90);
  --accent:oklch(0.55 0.15 145);
  --accent-dark:oklch(0.48 0.15 145);
  --accent-deep:oklch(0.34 0.09 145);
  --accent-soft:oklch(0.95 0.04 145);
  --accent-line:oklch(0.88 0.05 145);
  --star:oklch(0.68 0.15 85);
  --star-off:oklch(0.8 0.006 90);
  --danger:oklch(0.55 0.18 25);
  --danger-line:oklch(0.9 0.1 25);
  --warn-bg:oklch(0.97 0.03 85);
  --warn-line:oklch(0.9 0.05 85);
  --warn-text:oklch(0.45 0.06 60);
  --mono:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Work Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;
  overscroll-behavior-y:none;
}
::placeholder{color:var(--text-4)}
button{font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
a{color:var(--accent-dark)}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- app frame ---------- */
.hdr{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:12px;
}
.hdr h1{font-size:19px;font-weight:700;letter-spacing:-0.01em;margin:0;line-height:1.15}
.hdr .sub{font-size:12px;color:var(--text-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.icon-btn{
  background:none;border:1px solid var(--line-3);width:42px;height:42px;border-radius:10px;
  font-size:16px;cursor:pointer;color:var(--text-2);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.icon-btn:hover{background:oklch(0.97 0.006 90)}
.shell{display:flex;align-items:flex-start}
.main{flex:1;min-width:0;max-width:1180px;margin:0 auto;width:100%;
  padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px}
.card-h{font-size:15px;font-weight:600}
.muted{color:var(--text-3)}
.tiny{font-size:12px;color:var(--text-4)}
.sec-label{font-size:11.5px;font-weight:700;color:oklch(0.5 0.01 90);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}

/* ---------- controls ---------- */
.field{display:block;margin-bottom:5px;font-size:12.5px;color:oklch(0.5 0.01 90)}
input[type=text],input[type=number],input[type=url],select,textarea{
  width:100%;padding:11px 10px;border:1px solid var(--line-3);border-radius:8px;
  background:var(--surface);
}
input[type=number],.num{font-family:var(--mono)}
textarea{resize:vertical;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.btn{
  border:1px solid var(--line-3);background:var(--surface);color:var(--text-2);
  padding:11px 14px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:hover{background:oklch(0.97 0.006 90)}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent}
.btn-primary:hover{background:var(--accent-dark)}
.btn-dark{background:var(--text);color:#fff;border-color:transparent}
.btn-dark:hover{background:#000}
.btn-sm{padding:7px 11px;min-height:36px;font-size:12.5px;font-weight:500}
.btn-danger{border-color:var(--danger-line);color:var(--danger)}
.btn-danger:hover{background:oklch(0.97 0.03 25)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{
  display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);
  border:1px solid var(--accent-line);color:var(--accent-deep);
  padding:6px 8px 6px 12px;border-radius:20px;font-size:13px;
}
.chip button{background:none;border:none;color:oklch(0.45 0.06 145);font-size:16px;
  line-height:1;cursor:pointer;padding:2px 4px;min-width:26px;min-height:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips:empty{display:none}
.toggle{display:inline-flex;align-items:center;gap:10px;background:none;border:none;
  padding:8px 0;cursor:pointer;font-size:14.5px;font-weight:500;text-align:left}
.track{width:34px;height:20px;border-radius:10px;background:var(--star-off);
  position:relative;flex:0 0 auto;transition:background .15s}
.track i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle[aria-pressed=true] .track{background:var(--accent)}
.toggle[aria-pressed=true] .track i{left:16px}
.toggle[aria-pressed=true]{color:var(--accent-deep)}
.note{font-size:12.5px;color:var(--warn-text);background:var(--warn-bg);
  border:1px solid var(--warn-line);border-radius:8px;padding:10px 12px;margin-top:10px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.45);z-index:29}
.rail{
  background:var(--surface);border-right:1px solid var(--line);
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;overflow-y:auto;
}
.rail.drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:86vw;z-index:30;
  box-shadow:0 8px 40px rgba(0,0,0,.18);padding-top:calc(18px + env(safe-area-inset-top))}
.rail.docked{position:sticky;top:64px;flex:0 0 268px;width:268px;height:calc(100dvh - 64px)}
.q{display:flex;align-items:stretch;gap:10px;border:1px solid transparent;
  border-radius:10px;padding:10px 8px 10px 0}
.q:hover{background:oklch(0.97 0.006 90)}
.q.on{background:oklch(0.96 0.03 145);border-color:oklch(0.78 0.09 145)}
.q .bar{flex:0 0 3px;border-radius:3px;background:var(--line)}
.q.on .bar{background:var(--accent)}
.q .load{background:none;border:none;padding:0;text-align:left;width:100%;cursor:pointer;min-width:0}
.q .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q.on .nm{color:var(--accent-deep)}
.q .meta{font-size:11.5px;color:var(--text-3);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .cnt{font-size:11px;color:oklch(0.45 0.1 145);margin-top:5px;font-weight:600}
.q .del{background:none;border:none;color:oklch(0.7 0.01 90);font-size:16px;line-height:1;
  cursor:pointer;align-self:flex-start;padding:2px 4px;min-width:28px;min-height:28px}
.q .del:hover{color:var(--danger)}

/* ---------- search links ---------- */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.link{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-radius:10px;padding:13px 14px;
  text-decoration:none;color:var(--text);background:var(--surface);min-height:52px}
.link:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.link .nm{font-weight:600;font-size:13.5px}
.link .sub{font-size:11.5px;color:var(--text-4);margin-top:2px}
.link .go{color:var(--accent-dark);font-size:16px;flex:0 0 auto}

/* ---------- results ---------- */
.bar-row{display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;margin-bottom:12px}
.empty{background:var(--surface);border:1px dashed var(--line-3);border-radius:var(--radius);
  padding:36px 20px;text-align:center;color:var(--text-3)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:7px}
.item.on{background:var(--accent-soft);border-color:var(--accent-line)}
.item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item .ttl{font-size:15px;font-weight:600;line-height:1.3}
.item .price{font-size:19px;font-weight:700;font-family:var(--mono)}
.item .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--line-2);padding-top:10px;margin-top:2px;flex-wrap:wrap}
.star{background:none;border:none;font-size:22px;cursor:pointer;line-height:1;
  padding:2px 4px;color:var(--star-off);min-width:34px;min-height:34px}
.star.on{color:var(--star)}
.ok{color:oklch(0.45 0.12 145)}
.warnc{color:oklch(0.55 0.16 45)}
.pick{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-3);cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--accent)}
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:1040px}
thead tr{text-align:left;border-bottom:2px solid var(--line)}
th{padding:12px 8px;font-weight:600;white-space:nowrap}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--accent-dark)}
td{padding:10px 8px;vertical-align:top}
tbody tr{border-bottom:1px solid var(--line-2)}
tbody tr.on{background:var(--accent-soft)}

/* ---------- recommendations ---------- */
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rec{border:1px solid var(--line-2);border-radius:10px;padding:13px;
  display:flex;flex-direction:column;gap:6px}
.rec .badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:oklch(0.42 0.14 145)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,20,18,.45);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:0}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:100dvh;
  overflow-y:auto;border-radius:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-bottom:14px;position:sticky;top:-18px;background:var(--surface);
  padding:6px 0 10px;border-bottom:1px solid var(--line-2);z-index:1}
.sheet-h .t{font-size:17px;font-weight:700}
.x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-3);
  line-height:1;padding:4px 8px;min-width:40px;min-height:40px}
.cmp-row{display:grid;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.cmp-lbl{font-size:12.5px;font-weight:600;color:oklch(0.5 0.01 90)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;
  background:var(--accent);color:#fff;border:none;border-radius:28px;
  padding:0 20px;height:56px;font-size:15px;font-weight:600;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px}
.fab:hover{background:var(--accent-dark)}

@media (min-width:860px){
  body{font-size:15px}
  .hdr{padding:14px 24px}
  .hdr h1{font-size:22px}
  .main{padding:20px 24px 60px}
  .card{padding:20px 22px}
  .modal{padding:20px}
  .sheet{border-radius:14px;max-height:88vh;padding:24px}
  .sheet-h{top:-24px}
  input,select,textarea{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
(function () {

/* =====================================================================
   Reference data
   ===================================================================== */

var BRANDS = ['Audi','BMW','Citroën','Cupra','Dacia','Fiat','Ford','Honda','Hyundai','Kia',
  'Mazda','Mercedes-Benz','Nissan','Opel','Peugeot','Renault','Seat','Škoda','Suzuki',
  'Toyota','Volkswagen','Volvo'];

var FEATURES = [
  { key:'rearCamera',     label:'Rear camera' },
  { key:'parkingSensors', label:'Parking sensors' },
  { key:'cruiseControl',  label:'Cruise control / adaptive' },
  { key:'heatedSeats',    label:'Heated seats' },
  { key:'navigation',     label:'Navigation' },
  { key:'carplay',        label:'CarPlay / Android Auto' },
  { key:'frontCamera',    label:'Front camera / 360° view' },
  { key:'blindSpot',      label:'Blind spot monitor' },
  { key:'laneAssist',     label:'Lane keep assist' },
  { key:'ledMatrix',      label:'LED / matrix headlights' },
  { key:'panoramicRoof',  label:'Panoramic roof' },
  { key:'towbar',         label:'Towbar' },
  { key:'leatherSeats',   label:'Leather upholstery' },
  { key:'electricSeats',  label:'Electric seats' },
  { key:'heatedWheel',    label:'Heated steering wheel' },
  { key:'keyless',        label:'Keyless entry / start' },
  { key:'dualClimate',    label:'Dual-zone climate' },
  { key:'powerTailgate',  label:'Electric tailgate' },
  { key:'awd',            label:'All-wheel drive' },
  { key:'headUp',         label:'Head-up display' },
  { key:'trafficSign',    label:'Traffic sign recognition' },
  { key:'parkAssist',     label:'Automatic parking assist' }
];

var SITES = ['Autovit.ro','AutoScout24.ro','AutoScout24.de','mobile.de','OLX.ro','publi24.ro','lajumate.ro','OpenLane.eu','Carvago'];
var GERMAN_SITES = { 'AutoScout24.de':1, 'mobile.de':1 };

/* Sites the backend attempts automatically (mobile.de and OLX.ro both
   report an honest failure status — bot-protected/blocked, see server/
   search.js comments). OpenLane.eu and Carvago stay deep-link-only. */
var AUTO_SITES = { 'Autovit.ro':1, 'AutoScout24.ro':1, 'AutoScout24.de':1, 'mobile.de':1,
  'publi24.ro':1, 'OLX.ro':1, 'lajumate.ro':1 };
var API_BASE = (typeof window !== 'undefined' && window.FINDMYCAR_API_BASE) ||
  'https://findmycar-search-api.onrender.com';

var LS_SEARCHES = 'findmycar_searches_v1';
var LS_LISTINGS = 'findmycar_listings_v1';
var LS_EMAIL = 'findmycar_email_prefs_v1';

/* =====================================================================
   State
   ===================================================================== */

function blankFilters() {
  return { brands:[], model:'', priceMin:'', priceMax:'', yearMin:'', engineMax:'',
    hpMin:'', mileageMax:'', transmission:'Either', fuelTypes:[], features:[], country:'both',
    accidentFree:false, sources:[] };
}
function defaultFilters() {
  // No required features by default: portal search-result pages carry no
  // equipment data, so any required feature silently zeroes out automated
  // results on first use — a confusing "0 matches" with no obvious cause.
  return { brands:['Volkswagen','Škoda','Kia'], model:'', priceMin:14000, priceMax:20000,
    yearMin:2023, engineMax:2000, hpMin:150, mileageMax:'', transmission:'Automatic',
    fuelTypes:[], features:[], country:'both', accidentFree:true, sources:[] };
}
function blankForm() {
  return { title:'', brand:'Volkswagen', model:'', trim:'', year:'', price:'', mileage:'',
    engineSize:'', horsepower:'', transmission:'Automatic', fuelType:'Petrol', features:[],
    sourceSite:'Autovit.ro', url:'', country:'Romania', accidentStatus:'accident-free', riskNotes:[] };
}
function seedListings() {
  return [
    { id:'s1', title:'VW Tiguan Life 2.0 TDI DSG', brand:'Volkswagen', model:'Tiguan', trim:'Life',
      year:2023, price:18500, mileage:22000, engineSize:1968, horsepower:150, transmission:'Automatic',
      fuelType:'Diesel', features:['rearCamera','parkingSensors','cruiseControl','carplay'],
      sourceSite:'AutoScout24.de', url:'https://www.autoscout24.de/', country:'Germany',
      shortlisted:true, accidentStatus:'accident-free', accidentFree:true, addedAt:new Date().toISOString() },
    { id:'s2', title:'Škoda Kodiaq Style 2.0 TSI DSG', brand:'Škoda', model:'Kodiaq', trim:'Style',
      year:2024, price:19800, mileage:9000, engineSize:1984, horsepower:190, transmission:'Automatic',
      fuelType:'Petrol', features:['rearCamera','parkingSensors','cruiseControl','heatedSeats','navigation','carplay'],
      sourceSite:'mobile.de', url:'https://www.mobile.de/', country:'Germany',
      shortlisted:false, accidentStatus:'accident-free', accidentFree:true, addedAt:new Date().toISOString() },
    { id:'s3', title:'Kia Sportage GT-Line 1.6 T-GDI', brand:'Kia', model:'Sportage', trim:'GT-Line',
      year:2023, price:16900, mileage:15000, engineSize:1598, horsepower:150, transmission:'Automatic',
      fuelType:'Petrol', features:['rearCamera','cruiseControl','heatedSeats','carplay'],
      sourceSite:'Autovit.ro', url:'https://www.autovit.ro/', country:'Romania',
      shortlisted:false, accidentStatus:'repaired damage', accidentFree:false, addedAt:new Date().toISOString() }
  ];
}

var S = {
  listings: [],
  filters: defaultFilters(),
  savedSearches: [],
  activeSearchId: null,
  searchName: '',
  railOpen: false,
  railQuery: '',
  showFilters: true,
  showLinks: false,
  shortlistOnly: false,
  sortKey: 'price',
  sortDir: 'asc',
  selectedIds: [],
  isAddOpen: false,
  isCompareOpen: false,
  editId: null,
  formData: blankForm(),
  pasteText: '',
  pasteFeedback: '',
  isSearching: false,
  searchStatus: '',
  searchNotes: [],
  isEmailOpen: false,
  emailTo: '',
  emailSecret: '',
  emailStatus: '',
  isEmailSending: false,
  showEmailSecretField: false,
  width: window.innerWidth
};

function isMobile() { return S.width < 860; }

function readJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}
function writeJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
function persistListings() { writeJSON(LS_LISTINGS, S.listings); }
function persistSearches() { writeJSON(LS_SEARCHES, S.savedSearches); }

function load() {
  var qs = readJSON(LS_SEARCHES);
  if (qs && qs.length) S.savedSearches = qs;

  var saved = readJSON(LS_LISTINGS);
  if (saved && saved.length) {
    S.listings = saved.map(function (l) {
      if (l.accidentStatus) return l;
      var c = Object.assign({}, l);
      c.accidentStatus = l.accidentFree === true ? 'accident-free' : 'unknown';
      c.accidentFree = l.accidentFree === true;
      return c;
    });
  } else if (!saved) {
    // First visit, nothing in localStorage yet — seed a few example listings
    // so the table/recommendations/chart aren't empty on first load.
    S.listings = seedListings();
    persistListings();
  }
  var emailPrefs = readJSON(LS_EMAIL);
  if (emailPrefs) {
    S.emailTo = emailPrefs.to || '';
    S.emailSecret = emailPrefs.secret || '';
  }
  S.railOpen = window.innerWidth >= 860;
}
function persistEmailPrefs() { writeJSON(LS_EMAIL, { to: S.emailTo, secret: S.emailSecret }); }

/* =====================================================================
   Domain logic
   ===================================================================== */

/* Generation numbers (Golf 8 / Golf VIII / Golf Mk8 / Golf8) don't share one
   spelling across sites, and portals' own "model" field usually drops the
   generation entirely (e.g. Autovit's model is just "golf"). Normalise roman
   numerals and "mk" prefixes to plain digits, strip punctuation, and search
   across model + trim + title combined so a generation mentioned only in the
   listing's title still matches. */
var ROMAN_TO_ARABIC = {
  viii: '8', vii: '7', vi: '6', iv: '4', iii: '3', ii: '2',
  xii: '12', xi: '11', ix: '9', x: '10', v: '5', i: '1'
};
function normalizeModelText(s) {
  return String(s || '').toLowerCase()
    .replace(/\bmk\.?\s*/g, '')
    .replace(/([a-z])(\d)/g, '$1 $2').replace(/(\d)([a-z])/g, '$1 $2')
    .replace(/\b(viii|vii|vi|iv|iii|ii|xii|xi|ix|x|v|i)\b/g, function (m) { return ROMAN_TO_ARABIC[m]; })
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}
function modelMatches(query, l) {
  if (!query) return true;
  var nq = normalizeModelText(query);
  if (!nq) return true;
  var hay = normalizeModelText([l.model, l.trim, l.title].filter(Boolean).join(' '));
  return hay.indexOf(nq) > -1;
}

function matchesFilters(l, filters) {
  var f = filters || S.filters;
  if (f.brands.length && f.brands.indexOf(l.brand) === -1) return false;
  if (f.model && !modelMatches(f.model, l)) return false;
  if (f.priceMin !== '' && f.priceMin != null && l.price < Number(f.priceMin)) return false;
  if (f.priceMax !== '' && f.priceMax != null && l.price > Number(f.priceMax)) return false;
  if (f.yearMin !== '' && f.yearMin != null && l.year < Number(f.yearMin)) return false;
  if (f.engineMax !== '' && f.engineMax != null && l.engineSize > Number(f.engineMax)) return false;
  if (f.hpMin !== '' && f.hpMin != null && l.horsepower < Number(f.hpMin)) return false;
  if (f.mileageMax !== '' && f.mileageMax != null && l.mileage > Number(f.mileageMax)) return false;
  if (f.transmission !== 'Either' && l.transmission !== f.transmission) return false;
  if ((f.fuelTypes || []).length && f.fuelTypes.indexOf(l.fuelType) === -1) return false;
  if (f.features.length && !f.features.every(function (k) {
    return (l.features || []).indexOf(k) !== -1; })) return false;
  if (f.country !== 'both' && l.country !== f.country) return false;
  if ((f.sources || []).length && f.sources.indexOf(l.sourceSite) === -1) return false;
  // "Accident-free only" excludes confirmed damage, but doesn't hide unverified
  // results (portal search pages never expose accident history) — those stay
  // visible, clearly labelled "Not confirmed accident-free" in the History
  // column/card instead, so nothing is silently trusted either way.
  if (f.accidentFree && l.accidentStatus === 'repaired damage') return false;
  if (!filters && S.shortlistOnly && !l.shortlisted) return false;
  return true;
}

function scoreListing(l, ctx) {
  var reasons = [], score = 0, rel;
  if (ctx.maxPrice > ctx.minPrice) {
    rel = 1 - (l.price - ctx.minPrice) / (ctx.maxPrice - ctx.minPrice);
    score += rel * 40;
    if (rel > 0.66) reasons.push('lowest price in the set');
  }
  if (ctx.maxMileage > ctx.minMileage) {
    rel = 1 - (l.mileage - ctx.minMileage) / (ctx.maxMileage - ctx.minMileage);
    score += rel * 25;
    if (rel > 0.66) reasons.push('low mileage');
  }
  if (ctx.maxHp > ctx.minHp) {
    rel = (l.horsepower - ctx.minHp) / (ctx.maxHp - ctx.minHp);
    score += rel * 15;
    if (rel > 0.66) reasons.push(l.horsepower + ' hp');
  }
  score += ((l.features || []).length / FEATURES.length) * 15;
  if ((l.features || []).length >= 5) reasons.push(l.features.length + ' equipment items');
  if (l.year >= ctx.maxYear) { score += 5; reasons.push('newest year in the set'); }
  if (l.accidentFree === true) reasons.push('declared accident-free');
  return { score: score, reasons: reasons };
}

function brandSlug(b) {
  return b.toLowerCase()
    .replace(/š/g, 's').replace(/ë/g, 'e').replace(/ç/g, 'c')
    .replace(/é|è/g, 'e').replace(/\s+/g, '-');
}

/* Build pre-filtered search URLs for each selected portal.
   Brand goes in the path where the portal supports it; mobile.de needs numeric
   make ids we do not maintain, so its link carries only the numeric filters. */
function searchUrls() {
  var f = S.filters;
  var sites = (f.sources || []).length ? f.sources : SITES;
  var brands = f.brands.length ? f.brands : [''];
  var auto = f.transmission === 'Automatic';
  var out = [];

  sites.forEach(function (site) {
    if (f.country === 'Romania' && GERMAN_SITES[site]) return;
    if (f.country === 'Germany' && (site === 'Autovit.ro' || site === 'OLX.ro' ||
        site === 'AutoScout24.ro')) return;

    var perBrand = site === 'mobile.de' ? [''] : brands;

    perBrand.forEach(function (b) {
      var s = b ? brandSlug(b) : '', p = [], u = '';

      if (site === 'Autovit.ro') {
        if (f.priceMin) p.push('search%5Bfilter_float_price%3Afrom%5D=' + f.priceMin);
        if (f.priceMax) p.push('search%5Bfilter_float_price%3Ato%5D=' + f.priceMax);
        if (f.yearMin)  p.push('search%5Bfilter_float_year%3Afrom%5D=' + f.yearMin);
        if (f.hpMin)    p.push('search%5Bfilter_float_engine_power%3Afrom%5D=' + f.hpMin);
        if (f.engineMax) p.push('search%5Bfilter_float_engine_capacity%3Ato%5D=' + f.engineMax);
        if (f.mileageMax) p.push('search%5Bfilter_float_mileage%3Ato%5D=' + f.mileageMax);
        if (auto)       p.push('search%5Bfilter_enum_gearbox%5D=automatic');
        u = 'https://www.autovit.ro/autoturisme' + (s ? '/' + s : '') +
            (p.length ? '?' + p.join('&') : '');

      } else if (site === 'AutoScout24.ro' || site === 'AutoScout24.de') {
        var host = site === 'AutoScout24.ro' ? 'www.autoscout24.ro' : 'www.autoscout24.de';
        if (f.priceMin) p.push('pricefrom=' + f.priceMin);
        if (f.priceMax) p.push('priceto=' + f.priceMax);
        if (f.yearMin)  p.push('fregfrom=' + f.yearMin);
        if (f.hpMin)    p.push('powerfrom=' + f.hpMin, 'powertype=hp');
        if (f.mileageMax) p.push('kmto=' + f.mileageMax);
        if (auto)       p.push('gear=A');
        p.push('sort=price', 'desc=0');
        u = 'https://' + host + '/lst' + (s ? '/' + s : '') + '?' + p.join('&');

      } else if (site === 'mobile.de') {
        p.push('isSearchRequest=true', 'scopeId=C');
        if (f.priceMin) p.push('minPrice=' + f.priceMin);
        if (f.priceMax) p.push('maxPrice=' + f.priceMax);
        if (f.yearMin)  p.push('minFirstRegistrationDate=' + f.yearMin + '-01-01');
        if (f.hpMin)    p.push('minPowerAsArray=HP', 'minPower=' + f.hpMin);
        if (f.mileageMax) p.push('maxMileage=' + f.mileageMax);
        if (auto)       p.push('transmissions=AUTOMATIC_GEAR');
        u = 'https://suchen.mobile.de/fahrzeuge/search.html?' + p.join('&');

      } else if (site === 'OLX.ro') {
        u = 'https://www.olx.ro/auto-masini-moto-ambarcatiuni/autoturisme/' + (s ? s + '/' : '');
        var op = [];
        if (f.priceMin) op.push('search%5Bfilter_float_price%3Afrom%5D=' + f.priceMin);
        if (f.priceMax) op.push('search%5Bfilter_float_price%3Ato%5D=' + f.priceMax);
        if (f.yearMin)  op.push('search%5Bfilter_float_year%3Afrom%5D=' + f.yearMin);
        if (op.length) u += '?' + op.join('&');

      } else if (site === 'publi24.ro') {
        var pubSlug = b === 'Volkswagen' ? 'vw' : s;
        u = 'https://www.publi24.ro/anunturi/auto-moto/masini-second-hand/' + (pubSlug ? pubSlug + '/' : '');

      } else if (site === 'lajumate.ro') {
        u = 'https://lajumate.ro/anunturi/auto-moto-si-ambarcatiuni/autoturisme' + (s ? '/' + s : '');

      } else if (site === 'OpenLane.eu') {
        u = 'https://www.openlane.eu/en/findcar' + (b ? '?makesModels=' + encodeURIComponent(b) : '');

      } else if (site === 'Carvago') {
        u = 'https://carvago.com/cars' + (s ? '?make=' + s : '');
      }

      if (u) out.push({
        site: site,
        brand: b,
        url: u,
        note: site === 'mobile.de' ? 'price / year / gearbox — pick brand on site'
            : (b ? b : 'all brands')
      });
    });
  });
  return out;
}

/* ---- automated search against the backend adapters ----
   Only Autovit.ro / AutoScout24.ro / AutoScout24.de / mobile.de can be
   queried automatically (mobile.de is best-effort — it sits behind bot
   protection and usually comes back as an error). OLX.ro and Carvago have
   no adapter, so they only ever show up as deep links via searchUrls(). */
function requestedAutoSites() {
  var chosen = (S.filters.sources || []).length ? S.filters.sources : SITES;
  return chosen.filter(function (s) { return AUTO_SITES[s]; });
}

function mergeListings(fetched) {
  var byId = {};
  S.listings.forEach(function (l) { byId[l.id] = l; });
  var added = 0, updated = 0;
  fetched.forEach(function (l) {
    var prev = byId[l.id];
    if (prev) {
      var rec = Object.assign({}, l, { shortlisted: prev.shortlisted, addedAt: prev.addedAt || l.firstSeenAt });
      byId[l.id] = rec;
      updated++;
    } else {
      byId[l.id] = Object.assign({ shortlisted: false, addedAt: l.firstSeenAt }, l);
      added++;
    }
  });
  S.listings = Object.keys(byId).map(function (k) { return byId[k]; });
  persistListings();
  return { added: added, updated: updated };
}

function summariseSources(sources) {
  return sources.map(function (s) {
    if (s.status === 'ok') return s.site + ': ' + s.count;
    if (s.status === 'partial') return s.site + ': ' + s.count + ' (partial)';
    return s.site + ': ' + (s.site === 'mobile.de' ? "can't be automated" : 'failed');
  }).join(' · ');
}

function runAutoSearch() {
  var sites = requestedAutoSites();
  if (!sites.length) {
    S.searchStatus = 'None of the selected sites can be searched automatically — use the links below instead.';
    S.showLinks = true;
    render();
    scrollToId('links');
    return;
  }
  S.isSearching = true;
  S.searchStatus = 'Searching ' + sites.join(', ') + '…';
  S.showLinks = true;
  render();
  scrollToId('results-top');

  var controller = new AbortController();
  var timer = setTimeout(function () { controller.abort(); }, 45000);

  fetch(API_BASE + '/api/search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    signal: controller.signal,
    body: JSON.stringify(Object.assign({}, S.filters, { sources: sites, limit: 200 }))
  }).then(function (res) {
    clearTimeout(timer);
    if (!res.ok) return res.json().then(function (e) { throw new Error(e.error || ('HTTP ' + res.status)); });
    return res.json();
  }).then(function (data) {
    var fetched = data.listings || [];
    var merge = mergeListings(fetched);
    var passing = fetched.filter(function (l) { return matchesFilters(l, S.filters); }).length;
    var summary = fetched.length + ' results — ' + summariseSources(data.sources || []) +
      '. ' + merge.added + ' new, ' + merge.updated + ' updated.';
    if (fetched.length && passing < fetched.length) {
      var reason = S.filters.features.length
        ? 'a required feature your filters ask for (automated results don\'t include equipment data; see note below)'
        : 'your price / year / engine / power / mileage / transmission criteria';
      summary += ' Only ' + passing + ' of those show below — the rest don\'t match ' + reason + '.';
    }
    S.searchStatus = summary;
    S.searchNotes = data.notes || [];
    S.isSearching = false;
    render();
  }).catch(function (err) {
    clearTimeout(timer);
    var msg = err.name === 'AbortError'
      ? 'The search API took too long to respond (it may be waking up from sleep on a free host — try again in a moment).'
      : 'Search failed: ' + err.message + '. The API may be offline — try the links below instead.';
    S.searchStatus = msg;
    S.isSearching = false;
    render();
  });
}

/* ---- on-demand "email these results" ----
   Gated behind the same shared secret the backend's daily digest trigger
   uses, since the API otherwise has no auth at all and this sends a real
   email to whatever address is typed in. */
function toggleEmailPanel() {
  S.isEmailOpen = !S.isEmailOpen;
  S.emailStatus = '';
  render();
}
function sendResultsEmail() {
  var to = (S.emailTo || '').trim();
  var secret = (S.emailSecret || '').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) {
    S.emailStatus = 'Enter a valid email address.';
    render();
    return;
  }
  if (!secret) {
    S.emailStatus = 'Enter the trigger secret (same one set as DIGEST_TRIGGER_SECRET on the backend).';
    render();
    return;
  }
  persistEmailPrefs();
  var list = visibleListings();
  S.isEmailSending = true;
  S.emailStatus = 'Sending…';
  render();

  fetch(API_BASE + '/api/send-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      to: to,
      secret: secret,
      listings: list,
      heading: 'Find My Car — ' + (S.searchName || 'your search'),
      summaryLine: list.length + ' matches, sent from the app on ' + new Date().toISOString().slice(0, 10),
      subject: list.length + ' cars from Find My Car'
    })
  }).then(function (res) {
    return res.json().then(function (data) { return { ok: res.ok, data: data }; });
  }).then(function (r) {
    S.isEmailSending = false;
    S.emailStatus = r.ok ? ('Sent to ' + to + '.') : ('Failed: ' + (r.data.error || 'unknown error'));
    if (r.ok) S.showEmailSecretField = false;
    render();
  }).catch(function (err) {
    S.isEmailSending = false;
    S.emailStatus = 'Failed: ' + err.message;
    render();
  });
}

/* ---- paste parser: pull structured fields out of a copied listing ---- */
function parsePaste() {
  var raw = S.pasteText || '';
  if (!raw.trim()) return;
  var t = raw.toLowerCase().replace(/ /g, ' ');
  var f = Object.assign({}, S.formData);
  var num = function (m) { return m ? parseInt(String(m).replace(/[.\s,]/g, ''), 10) : null; };
  var v;

  var urlMatch = raw.match(/https?:\/\/\S+/);
  if (urlMatch) f.url = urlMatch[0];
  var host = (f.url || '').toLowerCase();
  if (host.indexOf('autovit') > -1) f.sourceSite = 'Autovit.ro';
  else if (host.indexOf('autoscout24.ro') > -1) f.sourceSite = 'AutoScout24.ro';
  else if (host.indexOf('autoscout24.de') > -1) f.sourceSite = 'AutoScout24.de';
  else if (host.indexOf('mobile.de') > -1) f.sourceSite = 'mobile.de';
  else if (host.indexOf('olx.ro') > -1) f.sourceSite = 'OLX.ro';
  else if (host.indexOf('publi24') > -1) f.sourceSite = 'publi24.ro';
  else if (host.indexOf('lajumate') > -1) f.sourceSite = 'lajumate.ro';
  else if (host.indexOf('openlane') > -1) f.sourceSite = 'OpenLane.eu';
  else if (host.indexOf('carvago') > -1) f.sourceSite = 'Carvago';
  f.country = GERMAN_SITES[f.sourceSite] ? 'Germany' : 'Romania';

  /* Grouped-with-separator number (18.000 / 18,000 / 18 000) or a bare 4-7 digit
     run. Deliberately does NOT allow a loose run of digits/separators, otherwise
     it can swallow digits from an unrelated earlier number (e.g. the year)
     across a comma and produce a bogus oversized value. The leading \b is
     load-bearing too: without it a match can start mid-way through a LARGER
     adjacent number — e.g. "Capacitate: 1422  CP: 75" misreading the tail of
     "1422" (engine cm³) as "422 CP" (confirmed live: a 2004 Polo 1.4 TDI
     came back showing 422 hp). Digits are \w chars, so \b never falls
     mid-run of a longer number — it forces the match to the number's start. */
  var NUM = '\\b(\\d{1,3}(?:[.,\\s]\\d{3})+|\\d{4,7}|\\d{1,3})';

  var price = t.match(new RegExp('(?:€|eur)\\s*' + NUM)) || t.match(new RegExp(NUM + '\\s*(?:€|eur)'));
  if (price) { v = num(price[1]); if (v && v > 500 && v < 500000) f.price = String(v); }

  var year = t.match(/\b(19[89]\d|20[0-4]\d)\b/);
  if (year) f.year = year[1];

  var km = t.match(new RegExp(NUM + '\\s*(?:km|kilometri|kilometer)'));
  if (km) { v = num(km[1]); if (v && v < 900000) f.mileage = String(v); }

  var cc = t.match(new RegExp(NUM + '\\s*(?:cm3|cm³|ccm|cc\\b)'));
  if (cc) { v = num(cc[1]); if (v && v > 600 && v < 8000) f.engineSize = String(v); }
  else {
    var litres = t.match(/\b([123][.,]\d)\s*(?:l\b|tdi|tsi|tfsi|dci|crdi|hdi)/);
    if (litres) f.engineSize = String(Math.round(parseFloat(litres[1].replace(',', '.')) * 1000));
  }

  // "LABEL: value" listings (e.g. "CP: 75 KW: 55") checked first and with
  // priority over kW — natural-phrasing matching below would otherwise read
  // "75 KW" out of that string, misattributing the CP field's value to kW
  // and multiplying it by 1.36 (confirmed live: a real 75 CP became 102).
  var hpLabeled = t.match(/\bcp\s*:?\s*(\d{2,3})\b/) || t.match(/\bhp\s*:?\s*(\d{2,3})\b/) ||
    t.match(/\bps\s*:?\s*(\d{2,3})\b/);
  if (hpLabeled) f.horsepower = hpLabeled[1];
  else {
    var hp = t.match(/\b(\d{2,3})\s*(?:cp|hp|ps|bhp)\b/);
    if (hp) f.horsepower = hp[1];
    else {
      var kwLabeled = t.match(/\bkw\s*:?\s*(\d{2,3})\b/);
      if (kwLabeled) f.horsepower = String(Math.round(parseInt(kwLabeled[1], 10) * 1.36));
      else {
        var kw = t.match(/\b(\d{2,3})\s*kw\b/);
        if (kw) f.horsepower = String(Math.round(parseInt(kw[1], 10) * 1.36));
      }
    }
  }

  if (/\b(automat|automatic|automatik|dsg|s.tronic|tiptronic|dct|cutie automat)/.test(t)) f.transmission = 'Automatic';
  else if (/\b(manual|manuala|manuală|schaltgetriebe)/.test(t)) f.transmission = 'Manual';

  // Plug-in (needs external charging) vs regular self-charging hybrid —
  // checked before the generic hybrid match, using the same badge markers
  // (GTE, TFSI e, Recharge, PHEV) the backend adapters use.
  var isPlugIn = /plug-?in|phev|priz[aă]|încărcare externă|incarcare externa|rechargeable|\bgte\b|tfsi ?e|\brecharge\b/.test(t);
  if (/\b(electric|elektro|ev)\b/.test(t) && !/hybrid|hibrid/.test(t)) f.fuelType = 'Electric';
  else if (/hybrid|hibrid/.test(t)) f.fuelType = isPlugIn ? 'Plug-in Hybrid' : 'Hybrid';
  else if (isPlugIn) f.fuelType = 'Plug-in Hybrid';
  else if (/diesel|tdi|crdi|dci|hdi|motorina|motorină/.test(t)) f.fuelType = 'Diesel';
  else if (/benzin|petrol|tsi|tfsi|gdi/.test(t)) f.fuelType = 'Petrol';

  // Picks whichever brand appears EARLIEST in the pasted text (usually the
  // title, since that's first), not the first brand in BRANDS array order —
  // otherwise a BMW listing whose description happens to mention "Audi"
  // later (a dealer's other stock, a comparison) gets mistagged as Audi.
  var brand = null, brandIdx = Infinity;
  BRANDS.forEach(function (b) {
    var idx = t.indexOf(b.toLowerCase());
    if (idx === -1 && b === 'Volkswagen') { var m1 = /\bvw\b/.exec(t); idx = m1 ? m1.index : -1; }
    if (idx === -1 && b === 'Škoda') { var m2 = /skoda/.exec(t); idx = m2 ? m2.index : -1; }
    if (idx === -1 && b === 'Mercedes-Benz') { var m3 = /mercedes/.exec(t); idx = m3 ? m3.index : -1; }
    if (idx > -1 && idx < brandIdx) { brandIdx = idx; brand = b; }
  });
  if (brand) f.brand = brand;

  if (/f[aă]r[aă] accident|unfallfrei|accident.free|neaccidentat|nu a fost accidentat/.test(t)) f.accidentStatus = 'accident-free';
  else if (/accidentat|unfallschaden|repaired damage|daune reparate/.test(t)) f.accidentStatus = 'repaired damage';
  else f.accidentStatus = 'unknown';

  /* Caution signals worth a manual look before trusting a listing — separate
     from the fields above because these are judgment calls, not facts to
     overwrite silently. Kept intentionally narrow (regex over free text is
     unreliable for anything subtler than a few fixed phrases). */
  var riskNotes = [];
  if (/\btaxi\b|inchiriere auto|închiriere auto|rent.?a.?car|mietwagen|flottenwagen|flottenfahrzeug|leihwagen/.test(t)) {
    riskNotes.push('possible taxi/rental/fleet history');
  }
  if (/export.?only|nur.?f[uü]r.?export|doar export|numai (?:la )?export|only for export/.test(t)) {
    riskNotes.push('listed as export-only');
  }
  var ownerMatch = t.match(/(\d+)\.?\s*(?:hand|vorbesitzer)/) || t.match(/(\d+)\s*proprietari/);
  if (ownerMatch) {
    var ownerN = parseInt(ownerMatch[1], 10);
    if (/hand/.test(ownerMatch[0]) && ownerN === 1) { /* "1. Hand" = original owner, not a caution */ }
    else if (ownerN > 2) riskNotes.push(ownerN + ' previous owners');
  }
  f.riskNotes = riskNotes;

  var featMap = {
    // Strict on rear-camera claims: only accept phrasing that specifically means
    // a reversing camera. "Frontkamera" (lane assist/ACC cam), "Einparkhilfe"
    // (parking sensors) and bare "Park Assist" are deliberately excluded —
    // none of them guarantee an actual camera.
    rearCamera: /camer[aă] (?:video )?(?:spate|marsarier)|r[uü]ckfahrkamera|\brfk\b|rear.?view camera|reversing camera|area view/,
    parkingSensors: /senzori (?:de )?parcare|parksensor|pdc|parking sensors/,
    cruiseControl: /(?:tempomat|cruise control|adaptive cruise|acc\b)/,
    heatedSeats: /scaune (?:încălzite|incalzite)|sitzheizung|heated seats/,
    navigation: /naviga(?:tie|ție)|navigation|navi\b/,
    carplay: /carplay|android auto/,
    frontCamera: /camer[aă] 360|360.?(?:grade|°)|surround view/,
    blindSpot: /unghi mort|blind spot|totwinkel/,
    laneAssist: /lane assist|men(?:t|ț)inere (?:pe )?banda|spurhalte/,
    ledMatrix: /matrix|led faruri|faruri led|led.?scheinwerfer|full led/,
    panoramicRoof: /panoramic|panorama/,
    towbar: /c[aâ]rlig|anh[aä]ngerkupplung|towbar/,
    leatherSeats: /piele|leder|leather/,
    electricSeats: /scaune electrice|elektrische sitze|power seats/,
    heatedWheel: /volan (?:încălzit|incalzit)|lenkradheizung|heated steering/,
    keyless: /keyless|acces f[aă]r[aă] cheie|schl[uü]ssellos/,
    dualClimate: /clima(?:tronic)? (?:bi|dual|2).?zon|dual.?zone|2.zonen/,
    powerTailgate: /haion electric|elektrische heckklappe|power tailgate/,
    awd: /4motion|4x4|quattro|awd|allrad|4wd/,
    headUp: /head.?up/,
    trafficSign: /recunoa(?:s|ș)tere (?:indicatoare|semne)|verkehrszeichen|traffic sign/,
    parkAssist: /asisten(?:t|ț)[aă] (?:la )?parcare|park assist|einparkhilfe automatisch/
  };
  var found = Object.keys(featMap).filter(function (k) { return featMap[k].test(t); });
  if (found.length) {
    var set = {};
    f.features.concat(found).forEach(function (k) { set[k] = 1; });
    f.features = Object.keys(set);
  }

  var firstLine = raw.split('\n').map(function (x) { return x.trim(); })
    .find(function (x) { return x.length > 3 && !/^https?:/.test(x); });
  if (firstLine && !f.title) f.title = firstLine.slice(0, 90);

  var filled = ['price','year','mileage','engineSize','horsepower']
    .filter(function (k) { return f[k]; }).length + found.length;

  S.formData = f;
  var msg = filled

  };
  if (S.editId) {

    S.listings = S.listings.map(function (l) { return l.id === S.editId ? rec : l; });

/* =====================================================================
   Tiny DOM helper
   ===================================================================== */

function el(tag, attrs, children) {
  var parts = tag.split('.');
  var node = document.createElement(parts[0]);
  if (parts.length > 1) node.className = parts.slice(1).join(' ');
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'cls') node.className = (node.className ? node.className + ' ' : '') + v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') node.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') node[k] = !!v;
    else node.setAttribute(k, v);
  });
  (children || []).forEach(function (c) {
    if (c == null || c === false) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}
function eur(n) { return '€' + Number(n || 0).toLocaleString('en-US'); }
function km(n) { return Number(n || 0).toLocaleString('en-US') + ' km'; }
function featuresText(keys) {
  var out = (keys || []).map(function (k) {
    var f = FEATURES.find(function (x) { return x.key === k; });
    return f ? f.label : null;
  }).filter(Boolean);
  return out.length ? out.join(', ') : '—';
}
function historyText(l) {
  var base;
  if (l.accidentFree === true) base = 'Accident-free';
  else if (l.accidentStatus === 'repaired damage') base = 'Accident damage reported';
  else base = 'Not confirmed accident-free';
  var risks = l.riskNotes || [];
  return risks.length ? base + ' · ⚠ ' + risks.join(', ') : base;
}
// A literal "0" reads as "confirmed zero equipment", but for automated
// results it really means "unknown — portal search pages don't list it"
// (same accidentStatus:'unknown' signal used everywhere else for this).
// Only show a real number once there's actual data to count.
function equipCountText(l) {
  var count = (l.features || []).length;
  if (count === 0 && l.accidentStatus === 'unknown') return '—';
  return String(count);
}

function toggleIn(arr, v) {

function saveSearch() {
  var name = (S.searchName || '').trim();
  if (!name) { alert('Give the search a name first.'); return; }
  var rec = {
    id: 'q' + Date.now(), name: name,
    filters: JSON.parse(JSON.stringify(S.filters)),
    transportEstimate: S.transportEstimate, rarFees: S.rarFees
  };
  var i = S.savedSearches.findIndex(function (q) {
    return q.name.toLowerCase() === name.toLowerCase(); });
  if (i >= 0) { rec.id = S.savedSearches[i].id; S.savedSearches[i] = rec; }
  else S.savedSearches = S.savedSearches.concat([rec]);
  S.activeSearchId = rec.id;
  persistSearches();
  render();
}
function loadSearch(id) {
  var q = S.savedSearches.find(function (x) { return x.id === id; });
  if (!q) return;
  S.filters = Object.assign(blankFilters(), JSON.parse(JSON.stringify(q.filters)));
  if (q.transportEstimate != null) S.transportEstimate = q.transportEstimate;
  if (q.rarFees != null) S.rarFees = q.rarFees;
  S.activeSearchId = id; S.searchName = q.name; S.selectedIds = [];
  if (isMobile()) S.railOpen = false;
  render();
}
function deleteSearch(id) {
  var q = S.savedSearches.find(function (x) { return x.id === id; });
  if (q && !confirm('Delete the saved search "' + q.name + '"?')) return;
  S.savedSearches = S.savedSearches.filter(function (x) { return x.id !== id; });
  if (S.activeSearchId === id) S.activeSearchId = null;
  persistSearches();
  render();

  var i = S.selectedIds.indexOf(id);

  S.listings = S.listings.filter(function (x) { return x.id !== id; });

  var minP = Math.min.apply(null, prices), maxP = Math.max.apply(null, prices);
  var minM = Math.min.apply(null, miles),  maxM = Math.max.apply(null, miles);
  var w = 400, h = 180, pad = 24;

  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '180');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Price versus mileage across your filtered results');

  [[pad, h - pad, w - pad, h - pad], [pad, pad, pad, h - pad]].forEach(function (c) {
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', c[0]); ln.setAttribute('y1', c[1]);
    ln.setAttribute('x2', c[2]); ln.setAttribute('y2', c[3]);
    ln.setAttribute('stroke', 'oklch(0.88 0.006 90)');
    svg.appendChild(ln);
  });

  filtered.forEach(function (l) {
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', maxM > minM ? pad + (l.mileage - minM) / (maxM - minM) * (w - 2 * pad) : w / 2);
    c.setAttribute('cy', maxP > minP ? h - pad - (l.price - minP) / (maxP - minP) * (h - 2 * pad) : h / 2);
    c.setAttribute('r', l.shortlisted ? 6 : 4);
    c.setAttribute('fill', l.shortlisted ? 'oklch(0.68 0.15 85)' : 'oklch(0.55 0.15 145)');
    var t = document.createElementNS(svgNS, 'title');
    t.textContent = l.title + ' · ' + eur(l.price) + ' · ' + km(l.mileage);
    c.appendChild(t);
    svg.appendChild(c);
  });

  return el('section.card', null, [
    el('div.card-h', { style: 'margin-bottom:10px', text: 'Price vs. mileage (filtered results)' }),
    svg,
    el('div', {
      style: 'display:flex;justify-content:space-between;font-size:11px;color:var(--text-4);margin-top:2px'
    }, [el('span', { text: 'lower mileage' }), el('span', { text: 'higher mileage →' })]),
    el('div.tiny', { style: 'margin-top:4px', text: '↑ higher price · amber dots are shortlisted' })
  ]);
}

function viewCard(l) {
  var sel = S.selectedIds.indexOf(l.id) > -1;
  return el('article.item' + (sel ? '.on' : ''), null, [
    el('div.top', null, [
      el('div.ttl', { text: l.title }),
      el('button.star' + (l.shortlisted ? '.on' : ''), {
        onclick: function () { toggleShortlist(l.id); },
        'aria-label': l.shortlisted ? 'Remove from shortlist' : 'Add to shortlist',
        'aria-pressed': String(!!l.shortlisted),
        text: l.shortlisted ? '★' : '☆'
      })
    ]),
    el('div', {
      style: 'font-size:13px;color:var(--text-3)',
      text: [l.year, l.transmission, l.fuelType, l.country].join(' · ')
    }),
    el('div', { style: 'display:flex;align-items:baseline;gap:10px;flex-wrap:wrap' }, [
      el('span.price', { text: eur(l.price) })
    ]),
    el('div.mono', {
      style: 'font-size:13px;color:var(--text-3)',
      text: km(l.mileage) + ' · ' + l.engineSize + ' cm³ · ' + l.horsepower + ' hp'
    }),
    el('div', {
      cls: l.accidentFree === true ? 'ok' : 'warnc',
      style: 'font-size:12.5px',
      text: historyText(l)
    }),
    el('div', {
      style: 'font-size:12.5px;color:var(--text-2)', text: featuresText(l.features)
    }),
    el('div.foot', null, [
      el('label.pick', null, [
        el('input', {
          type: 'checkbox', checked: sel, disabled: !sel && S.selectedIds.length >= 3,
          onchange: function () { toggleSelect(l.id); }
        }),
        'Compare'
      ]),
      el('div', { style: 'display:flex;gap:8px;align-items:center' }, [
        l.url ? el('a', {
          href: l.url, target: '_blank', rel: 'noopener noreferrer',
          style: 'font-size:12.5px;text-decoration:none', text: l.sourceSite + ' ↗'
        }) : el('span.tiny', { text: l.sourceSite }),
        el('button.btn.btn-sm', { onclick: function () { openEdit(l.id); }, text: 'Edit' }),
        el('button.btn.btn-sm.btn-danger', {
          onclick: function () { deleteListing(l.id); }, text: 'Delete'
        })
      ])
    ])
  ]);
}

function viewTable(list) {
  function th(label, key) {
    if (!key) return el('th', { text: label });
    var arrow = S.sortKey === key ? (S.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    return el('th.sort', {
      onclick: function () { sortBy(key); },
      'aria-sort': S.sortKey === key ? (S.sortDir === 'asc' ? 'ascending' : 'descending') : 'none',
      text: label + arrow
    });
  }

  return el('div.tbl-wrap', null, [
    el('table', null, [
      el('thead', null, [
        el('tr', null, [
          el('th', { style: 'width:36px' }), el('th', { style: 'width:32px' }),
          th('Listing'), th('Year', 'year'), th('Price', 'price'),
          th('Mileage', 'mileage'), th('Engine'), th('HP', 'horsepower'),
          th('Transmission'), th('History'), th('Equip.'), th('Features'),
          th('Source'), th('Actions')
        ])
      ]),
      el('tbody', null, list.map(function (l) {
        var sel = S.selectedIds.indexOf(l.id) > -1;
        return el('tr' + (sel ? '.on' : ''), null, [
          el('td', null, [el('input', {
            type: 'checkbox', checked: sel, disabled: !sel && S.selectedIds.length >= 3,
            'aria-label': 'Compare ' + l.title,
            onchange: function () { toggleSelect(l.id); }
          })]),
          el('td', null, [el('button.star' + (l.shortlisted ? '.on' : ''), {
            style: 'font-size:17px',
            onclick: function () { toggleShortlist(l.id); },
            'aria-label': 'Shortlist ' + l.title,
            text: l.shortlisted ? '★' : '☆'
          })]),
          el('td', null, [
            el('div', { style: 'font-weight:600', text: l.title }),
            el('div.tiny', { text: l.fuelType + ' · ' + l.country })
          ]),
          el('td', { text: String(l.year) }),
          el('td.mono', { style: 'font-weight:600', text: eur(l.price) }),
          el('td.mono', { text: km(l.mileage) }),
          el('td.mono', { text: l.engineSize + ' cm³' }),
          el('td.mono', { text: String(l.horsepower) }),
          el('td', { text: l.transmission }),
          el('td', {
            cls: l.accidentFree === true ? 'ok' : 'warnc',
            style: 'font-size:12.5px',
            text: historyText(l)
          }),
          el('td.mono', {
            style: 'text-align:center',
            text: equipCountText(l)
          }),
          el('td', {
            style: 'max-width:220px;font-size:12.5px;color:var(--text-2)',
            text: featuresText(l.features)
          }),
          el('td', null, [
            l.url ? el('a', {
              href: l.url, target: '_blank', rel: 'noopener noreferrer',
              style: 'font-size:12.5px;text-decoration:none', text: l.sourceSite + ' ↗'
            }) : el('span.tiny', { text: l.sourceSite })
          ]),
          el('td', { style: 'white-space:nowrap' }, [
            el('button.btn.btn-sm', { onclick: function () { openEdit(l.id); }, text: 'Edit' }),
            ' ',
            el('button.btn.btn-sm.btn-danger', {
              onclick: function () { deleteListing(l.id); }, text: 'Delete'
            })
          ])
        ]);
      }))
    ])
  ]);
}

function viewEmailPanel(list) {
  if (!S.isEmailOpen) return null;
  return el('div.card', { style: 'margin-bottom:14px' }, [
    el('div.card-h', { text: 'Email these results' }),
    el('div.tiny', {
      style: 'margin:4px 0 10px',
      text: 'Sends the ' + list.length + ' listing' + (list.length === 1 ? '' : 's') + ' currently shown below. ' +
        'The secret is the same DIGEST_TRIGGER_SECRET set on the backend — needed so this can\'t be used to spam ' +
        'strangers, since the app has no login.'
    }),
    el('div.grid', { style: 'margin-bottom:10px' }, [
      el('div', null, [
        el('label.field', { text: 'Send to' }),
        el('input', {
          type: 'text', value: S.emailTo, placeholder: 'someone@example.com',
          oninput: function (e) { S.emailTo = e.target.value; }
        })
      ]),
      (S.emailSecret && !S.showEmailSecretField) ? el('div', null, [
        el('label.field', { text: 'Trigger secret' }),
        el('div', { style: 'display:flex;align-items:center;gap:8px;padding-top:8px' }, [
          el('span.tiny', { text: 'Saved ✓' }),
          el('button.btn.btn-sm', {
            onclick: function () { S.showEmailSecretField = true; render(); },
            text: 'Change'
          })
        ])
      ]) : el('div', null, [
        el('label.field', { text: 'Trigger secret' }),
        el('input', {
          type: 'password', value: S.emailSecret, placeholder: 'DIGEST_TRIGGER_SECRET',
          oninput: function (e) { S.emailSecret = e.target.value; }
        })
      ])
    ]),
    el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, [
      el('button.btn.btn-primary', {
        onclick: sendResultsEmail,
        disabled: S.isEmailSending || !list.length,
        text: S.isEmailSending ? 'Sending…' : 'Send email'
      }),
      el('button.btn', { onclick: toggleEmailPanel, text: 'Cancel' })
    ]),
    S.emailStatus ? el('div.note', { style: 'margin-top:10px', text: S.emailStatus }) : null
  ]);
}

function viewResults() {
  var list = visibleListings();
  var wrap = el('div', { id: 'results' });

  wrap.appendChild(el('div.bar-row', null, [
    el('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' }, [
      el('strong', {
        text: list.length + (list.length === 1 ? ' match' : ' matches')
      }),
      el('span.tiny', {
        text: 'of ' + S.listings.length + ' saved ' + (S.listings.length === 1 ? 'listing' : 'listings')
      })
    ]),
    el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, [
      el('button.btn.btn-sm', {
        onclick: function () { S.shortlistOnly = !S.shortlistOnly; render(); },
        'aria-pressed': String(S.shortlistOnly),
        style: S.shortlistOnly ? 'border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-deep)' : '',
        text: S.shortlistOnly ? '★ Shortlist only' : '☆ Shortlist only'
      }),
      S.selectedIds.length ? el('button.btn.btn-sm.btn-dark', {
        disabled: S.selectedIds.length < 2,
        onclick: function () { S.isCompareOpen = true; render(); },
        text: 'Compare (' + S.selectedIds.length + ')'
      }) : null,
      el('button.btn.btn-sm', {
        onclick: toggleEmailPanel,
        'aria-pressed': String(S.isEmailOpen),
        text: '✉ Email these results'
      })
    ])
  ]));

  wrap.appendChild(viewEmailPanel(list) || document.createComment(''));
  wrap.appendChild(viewRecommendations(list) || document.createComment(''));
  wrap.appendChild(viewChart(list) || document.createComment(''));

  if (!list.length) {
    wrap.appendChild(el('div.empty', null, [
      el('div', {
        style: 'font-size:15px;margin-bottom:10px;color:var(--text-2)',
        text: S.listings.length ? 'No listings match your current filters.' : 'No listings yet.'
      }),
      el('div', {
        style: 'font-size:13px;line-height:1.6;max-width:520px;margin:0 auto 16px',
        text: S.listings.length
          ? 'Loosen a filter above to see them.'
          : 'Set your criteria above and press Search to pull in matching listings.'
      })
    ]));
  } else if (isMobile()) {
    list.forEach(function (l) { wrap.appendChild(viewCard(l)); });
  } else {
    wrap.appendChild(viewTable(list));
  }
  return wrap;
}

/* ---------- add / edit listing sheet ---------- */

function viewAddSheet() {
  var f = S.formData;
  function txt(label, key, opts) {
    opts = opts || {};
    return el('div', null, [
      el('label.field', { text: label }),
      el('input', {
        type: opts.num ? 'number' : 'text',
        inputmode: opts.num ? 'numeric' : null,
        value: f[key], placeholder: opts.ph || '',
        oninput: function (e) { f[key] = e.target.value; }
      })
    ]);
  }
  function sel(label, key, options) {
    return el('div', null, [
      el('label.field', { text: label }),
      el('select', { onchange: function (e) { f[key] = e.target.value; } },
        options.map(function (o) {
          return el('option', { value: o, text: o, selected: f[key] === o });
        }))
    ]);
  }

  return el('div.modal', {
    onclick: function (e) { if (e.target === e.currentTarget) closeModal(); }
  }, [
    el('div.sheet', { role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Add listing' }, [
      el('div.sheet-h', null, [
        el('div.t', { text: S.editId ? 'Edit listing' : 'Add listing' }),
        el('button.x', { onclick: closeModal, 'aria-label': 'Close', text: '×' })
      ]),

      el('div', { style: 'margin-bottom:16px' }, [
        el('div.sec-label', { text: 'Paste from the portal' }),
        el('div.tiny', {
          style: 'margin-bottom:8px',
          text: 'Select the listing text on Autovit / AutoScout24 / mobile.de, copy it, and paste here. ' +
                'Include the URL so the source is recorded.'
        }),
        el('textarea', {
          rows: isMobile() ? 5 : 6, value: S.pasteText,
          placeholder: 'Paste the listing text and its link here…',
          oninput: function (e) { S.pasteText = e.target.value; }
        }),
        el('div', { style: 'display:flex;gap:8px;margin-top:8px;flex-wrap:wrap' }, [
          el('button.btn.btn-primary', { onclick: parsePaste, text: 'Read the paste' }),
          el('button.btn', {
            onclick: function () {
              if (!navigator.clipboard || !navigator.clipboard.readText) {
                S.pasteFeedback = 'This browser will not let the page read the clipboard — paste into the box instead.';
                render(); return;
              }
              navigator.clipboard.readText().then(function (t) {
                S.pasteText = t; parsePaste();
              })['catch'](function () {
                S.pasteFeedback = 'Clipboard access was refused — paste into the box instead.';
                render();
              });
            },
            text: 'Paste from clipboard'
          })
        ]),
        S.pasteFeedback ? el('div.note', { text: S.pasteFeedback }) : null
      ]),

      el('div.sec-label', { text: 'Listing details' }),
      el('div', { style: 'margin-bottom:12px' }, [txt('Title', 'title', { ph: 'VW Tiguan Life 2.0 TDI DSG' })]),
      el('div.grid', { style: 'margin-bottom:12px' }, [
        el('div', null, [
          el('label.field', { text: 'Brand' }),
          el('select', { onchange: function (e) { f.brand = e.target.value; } },
            BRANDS.map(function (b) {
              return el('option', { value: b, text: b, selected: f.brand === b });
            }))
        ]),
        txt('Model', 'model', { ph: 'Tiguan' }),
        txt('Trim', 'trim', { ph: 'Life' }),
        txt('Year', 'year', { num: true }),
        txt('Price (€)', 'price', { num: true }),
        txt('Mileage (km)', 'mileage', { num: true }),
        txt('Engine (cm³)', 'engineSize', { num: true }),
        txt('Horsepower', 'horsepower', { num: true }),
        sel('Transmission', 'transmission', ['Automatic', 'Manual']),
        sel('Fuel', 'fuelType', ['Petrol', 'Diesel', 'Hybrid', 'Plug-in Hybrid', 'Electric']),
        sel('Source', 'sourceSite', SITES),
        sel('Market', 'country', ['Romania', 'Germany']),
        sel('Accident history', 'accidentStatus', ['accident-free', 'repaired damage', 'unknown'])
      ]),
      el('div', { style: 'margin-bottom:14px' }, [txt('Listing URL', 'url', { ph: 'https://…' })]),

      el('div.sec-label', { text: 'Equipment' }),
      el('div', {
        style: 'display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-bottom:16px'
      }, FEATURES.map(function (x) {
        return el('label.pick', null, [
          el('input', {
            type: 'checkbox', checked: f.features.indexOf(x.key) > -1,
            onchange: function () { toggleIn(f.features, x.key); }
          }),
          x.label
        ]);
      })),

      el('div', { style: 'display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap' }, [
        el('button.btn', { onclick: closeModal, text: 'Cancel' }),
        el('button.btn.btn-primary', {
          onclick: saveListing, text: S.editId ? 'Save changes' : 'Add to my list'
        })
      ])
    ])
  ]);
}

function viewCompareSheet() {
  var picked = S.selectedIds
    .map(function (id) { return S.listings.find(function (l) { return l.id === id; }); })
    .filter(Boolean);
  var cols = '130px repeat(' + Math.max(picked.length, 1) + ', minmax(120px,1fr))';

  var rows = [
    ['Brand', function (l) { return l.brand; }],
    ['Model', function (l) { return l.model || '—'; }],
    ['Trim', function (l) { return l.trim || '—'; }],
    ['Year', function (l) { return String(l.year); }],
    ['Price', function (l) { return eur(l.price); }],
    ['Mileage', function (l) { return km(l.mileage); }],
    ['Engine', function (l) { return l.engineSize + ' cm³'; }],
    ['Horsepower', function (l) { return l.horsepower + ' hp'; }],
    ['Transmission', function (l) { return l.transmission; }],
    ['Fuel', function (l) { return l.fuelType; }],
    ['Features', function (l) { return featuresText(l.features); }],
    ['Accident history', function (l) { return historyText(l); }],
    ['Source', function (l) { return l.sourceSite; }]
  ];

  return el('div.modal', {
    onclick: function (e) { if (e.target === e.currentTarget) closeModal(); }
  }, [
    el('div.sheet', { role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Compare listings' }, [
      el('div.sheet-h', null, [
        el('div.t', { text: 'Compare listings' }),
        el('button.x', { onclick: closeModal, 'aria-label': 'Close', text: '×' })
      ]),
      el('div', { style: 'overflow-x:auto' }, [
        el('div', { style: 'min-width:' + (140 + picked.length * 130) + 'px' }, [
          el('div', {
            style: 'display:grid;grid-template-columns:' + cols +
                   ';gap:10px;padding-bottom:12px;border-bottom:2px solid var(--line)'
          }, [el('div')].concat(picked.map(function (l) {
            return el('div', null, [
              el('div', { style: 'font-weight:700;font-size:13.5px;margin-bottom:4px', text: l.title }),
              el('div.mono', { style: 'font-weight:600;margin-bottom:6px', text: eur(l.price) }),
              el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, [
                l.url ? el('a', {
                  href: l.url, target: '_blank', rel: 'noopener noreferrer',
                  style: 'font-size:12px;text-decoration:none', text: 'View ↗'
                }) : null,
                el('button', {
                  style: 'background:none;border:none;font-size:12px;color:var(--danger);cursor:pointer;padding:0',
                  onclick: function () { toggleSelect(l.id); }, text: 'Remove'
                })
              ])
            ]);
          }))),
          el('div', null, rows.map(function (r) {
            return el('div.cmp-row', { style: 'grid-template-columns:' + cols }, [
              el('div.cmp-lbl', { text: r[0] })
            ].concat(picked.map(function (l) {
              return el('div', { style: 'font-size:13px', text: r[1](l) });
            })));
          }))
        ])
      ])
    ])
  ]);
}

/* =====================================================================
   Render
   ===================================================================== */

function scrollToId(id) {
  requestAnimationFrame(function () {
    var n = document.getElementById(id);
    if (n) n.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function renderResultsOnly() {
  var old = document.getElementById('results');
  if (!old) { render(); return; }
  old.replaceWith(viewResults());
}
function renderRailOnly() {
  var old = document.querySelector('.rail');
  if (!old) { render(); return; }
  var focused = document.activeElement;
  var wasQuery = focused && focused.parentNode === old && focused.tagName === 'INPUT';
  var pos = wasQuery ? focused.selectionStart : null;
  old.replaceWith(viewRail());
  if (wasQuery) {
    var next = document.querySelector('.rail input[type=text]');
    if (next) { next.focus(); if (pos != null) next.setSelectionRange(pos, pos); }
  }
}

function render() {
  var root = document.getElementById('app');
  root.textContent = '';

  root.appendChild(viewHeader());

  var shell = el('div.shell');
  if (S.railOpen && isMobile()) {
    shell.appendChild(el('div.scrim', {
      onclick: function () { S.railOpen = false; render(); }
    }));
  }
  if (S.railOpen) shell.appendChild(viewRail());

  var main = el('main.main');
  main.appendChild(viewFilters());
  var links = viewLinks();
  if (links) main.appendChild(links);
  main.appendChild(viewResults());
  shell.appendChild(main);
  root.appendChild(shell);

  if (S.isAddOpen) root.appendChild(viewAddSheet());
  else if (S.isCompareOpen) root.appendChild(viewCompareSheet());

  document.body.style.overflow = (S.isAddOpen || S.isCompareOpen) ? 'hidden' : '';
}

/* =====================================================================
   Boot
   ===================================================================== */

var resizeTimer;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    var wasMobile = isMobile();
    S.width = window.innerWidth;
    if (wasMobile !== isMobile()) {
      S.railOpen = !isMobile();
      render();
    }
  }, 150);
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && (S.isAddOpen || S.isCompareOpen)) closeModal();
});

load();
render();

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function () {});
  });
}

})();
</script>
