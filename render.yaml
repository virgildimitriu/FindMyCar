services:
  - type: web
    name: findmycar-search-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CONTACT_EMAIL
        value: virgildimitriu@yahoo.com
      # Installs Playwright's browsers into node_modules instead of the home
      # cache dir — Render's build and runtime steps don't share the home
      # cache, so browsers "installed" during build were missing at runtime.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
    healthCheckPath: /health
